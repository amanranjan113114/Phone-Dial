<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="A simple browser dial pad that opens your phone app to place SIM-network calls.">
  <title>Dial — Simple Caller</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">d</div>
        <div><div class="brand-name">dial</div><div class="brand-subtitle">Simple caller</div></div>
      </div>
      <button id="installBtn" class="install-btn" hidden type="button">Install</button>
    </header>

    <nav class="tabs" aria-label="Main navigation">
      <button class="tab active" data-view="dialer" type="button">Keypad</button>
      <button class="tab" data-view="history" type="button">Recent</button>
    </nav>

    <section id="dialerView" class="view">
      <div class="number-panel">
        <label class="sr-only" for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="tel" inputmode="tel" autocomplete="tel" placeholder="Enter number" maxlength="24" aria-describedby="numberHint">
        <div id="numberHint" class="number-hint">Enter a number to get started</div>
      </div>

      <div class="keypad" aria-label="Dial pad">
        <button class="key" data-key="1" type="button"><span>1</span><small>&nbsp;</small></button>
        <button class="key" data-key="2" type="button"><span>2</span><small>ABC</small></button>
        <button class="key" data-key="3" type="button"><span>3</span><small>DEF</small></button>
        <button class="key" data-key="4" type="button"><span>4</span><small>GHI</small></button>
        <button class="key" data-key="5" type="button"><span>5</span><small>JKL</small></button>
        <button class="key" data-key="6" type="button"><span>6</span><small>MNO</small></button>
        <button class="key" data-key="7" type="button"><span>7</span><small>PQRS</small></button>
        <button class="key" data-key="8" type="button"><span>8</span><small>TUV</small></button>
        <button class="key" data-key="9" type="button"><span>9</span><small>WXYZ</small></button>
        <button class="key symbol-key" data-key="*" type="button"><span>*</span><small>&nbsp;</small></button>
        <button class="key" data-key="0" type="button"><span>0</span><small>+</small></button>
        <button class="key symbol-key" data-key="#" type="button"><span>#</span><small>&nbsp;</small></button>
      </div>

      <div class="actions">
        <button id="clearBtn" class="utility-btn" type="button" aria-label="Clear number" title="Clear number">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l6-7h12v14H9l-6-7z"/><path d="M12 9l6 6m0-6l-6 6"/></svg>
        </button>
        <a id="callBtn" class="call-btn disabled" href="#" aria-disabled="true" aria-label="Call number">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.5l3 3.8-2 2.4a15.5 15.5 0 0 0 6.1 6.1l2.4-2 3.8 3c.5.4.6 1.1.3 1.7l-1.2 2.1c-.4.6-1.1.9-1.8.8C9.4 20.1 3.9 14.6 2.6 6.2c-.1-.7.2-1.4.8-1.8l2.1-1.2c.6-.3 1.3-.2 1.7.3z"/></svg>
        </a>
        <button id="backspaceBtn" class="utility-btn" type="button" aria-label="Delete last digit" title="Delete last digit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l6-7h12v14H9l-6-7z"/><path d="M13 9l5 6m0-6l-5 6"/></svg>
        </button>
      </div>
      <p class="privacy-note">Calls are placed by your phone app. Your recent numbers stay on this device.</p>
    </section>

    <section id="historyView" class="view" hidden>
      <div class="section-heading">
        <div><h1>Recent calls</h1><p>Numbers you tried to call from this website</p></div>
        <button id="clearHistoryBtn" class="text-btn" type="button">Clear all</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div id="emptyHistory" class="empty-state">
        <div class="empty-icon" aria-hidden="true">↗</div>
        <strong>No recent numbers</strong>
        <p>Numbers you dial will appear here.</p>
      </div>
    </section>

    <footer class="footer">Made for quick, simple calling</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
